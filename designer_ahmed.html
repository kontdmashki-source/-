<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المصمم احمد · سلّم المستويات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#071426;--s1:#101f3300;--panel:#10233a88;--line:#29435f;--tx:#eef5ff;--mu:#9bb0c8;--vi:#3988d8;--go:#dce8f5;--rd:#68c5ff;--st:#c6d5e5;--chip:#10243b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef4fa;--panel:#ffffffd9;--line:#c7d6e5;--tx:#14263a;--mu:#627a94;--go:#607f9e;--rd:#1677bd;--st:#425a73;--chip:#e0eaf4}}
:root[data-theme="light"]{--bg:#eef4fa;--panel:#ffffffd9;--line:#c7d6e5;--tx:#14263a;--mu:#627a94;--go:#607f9e;--rd:#1677bd;--st:#425a73;--chip:#e0eaf4}
:root[data-theme="dark"]{--bg:#071426;--panel:#10233a88;--line:#29435f;--tx:#eef5ff;--mu:#9bb0c8;--go:#dce8f5;--rd:#68c5ff;--st:#c6d5e5;--chip:#10243b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:400 15px/1.6 Tajawal,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 80px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font:700 28px/1 "Chakra Petch",sans-serif;background:linear-gradient(180deg,#ffffff 0,#dce8f5 45%,#8298b0 55%,#f3f8ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);font-size:12.5px;margin-top:4px}
.tg{background:var(--chip);border:1px solid var(--line);color:var(--tx);border-radius:10px;width:40px;height:40px;cursor:pointer}
.meter{margin-top:22px;border:1px solid var(--line);background:var(--panel);border-radius:6px 22px 6px 22px;padding:16px}
.in{display:flex;gap:8px;margin-top:8px}
.in input{flex:1;background:var(--chip);border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:12px 14px}
.in button{background:linear-gradient(135deg,var(--vi),#205b98);color:#fff;border:0;border-radius:10px;padding:0 16px;cursor:pointer}
footer{margin-top:30px;color:var(--mu);font-size:12px;border-top:1px dashed var(--line);padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
    <header>
        <div>
            <div class="logo">AHMAD DESIGNER</div>
            <div class="sub">المصمم احمد · سلّم المستويات</div>
        </div>
        <button class="tg" id="thBtn">🌙</button>
    </header>
    <div class="meter">
        <label>أدخل النقاط أو المستوى:</label>
        <div class="in">
            <input type="number" id="pointsInput" placeholder="0000">
            <button id="calcBtn">احسب</button>
        </div>
    </div>
    <footer>
        <div>تصميم وبرمجة AHMAD &copy; 2026</div>
    </footer>
</div>
<script>
const config = JSON.parse(localStorage.getItem("ahmadDesigner") || '{"th":"dark"}');
document.documentElement.setAttribute('data-theme', config.th);
const thBtn = document.getElementById('thBtn');
thBtn.textContent = config.th === 'dark' ? '☀️' : '🌙';
thBtn.addEventListener('click', () => {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    thBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
    localStorage.setItem("ahmadDesigner", JSON.stringify({th: newTheme}));
});
</script>
</body>
</html>
